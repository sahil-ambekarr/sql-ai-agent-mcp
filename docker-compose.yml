# SQL Server backend for the MCP server.
# NOT verified locally: the machine this repo was built on has no Docker.
#
#   cp .env.example .env        # set MSSQL_SA_PASSWORD and MSSQL_PASSWORD
#   docker compose up -d        # starts SQL Server, then seeds it once
#   DB_BACKEND=mssql npm run server
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mssql-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      READER_PASSWORD: ${MSSQL_PASSWORD:?set MSSQL_PASSWORD in .env}
      DB_NAME: ${MSSQL_DATABASE:-SampleBusiness}
    volumes:
      - ./mssql/init:/init:ro
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -b
        -v DB_NAME="$$DB_NAME" READER_PASSWORD="$$READER_PASSWORD"
        -i /init/01-seed.sql
    restart: "no"
